name: Update West Bros RSS
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: westbros-archive-upload
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Internet Archive uploader
        run: python -m pip install 'internetarchive>=5,<6'
      - name: Check Blogger and update Archive if needed
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python update_feed.py
